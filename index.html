<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   <title>Brandos</title>

   <style>
 
      body {
         background-color: #1e1e1e;
         color: #d4d4d4;
         display: flex;
         flex-direction: column;
         align-items: center;
         margin-top: 50px;
         font-family: sans-serif;
      }

      .app-container {
         display: flex;
         flex-direction: row;      /* Places children side-by-side */boot/
         align-items: flex-start;  /* Aligns them at the top */ 
         flex-wrap: wrap;
         justify-content: center;  /* Centers the whole block on the page */
         gap: 10px;                /* Adds space between canvas and text */
         max-width: 1000px;
         width: 100%;
      }

      .instructions {
         max-width: 300px;         /* Prevents the text from stretching too far */
         background-color: #2a2a2a;/* Slightly lighter box for contrast */
         padding: 20px;
         border-radius: 8px;
         border: 1px solid #444;
         color: #ccc;
         line-height: 1.5;
      }

      .instructions ul {
         list-style-type: none; /* This hides the bullets */
         padding-left: 20px;    /* Optional: Shrinks the empty space where the bullet used to be */
      }

      /* Optional: Style keyboard keys to look like physical buttons */
      kbd {
         background-color: #444;
         border: 1px solid #666;
         border-radius: 4px;
         padding: 2px 6px;
         font-family: monospace;
         font-size: 0.9em;
         color: #fff;
      }

      .bottom-panel {
         width: 100%;
         max-width: 960px;      /* Matches the max-width of your app-container */
         background-color: #2a2a2a;
         padding: 20px;
         border-radius: 8px;
         border: 1px solid #444;
         margin-top: 30px;       /* Pushes it down so it doesn't touch the canvas */
         box-sizing: border-box; /* Keeps padding inside the defined width */
      }

      /* The class and id are both required for Emscripten's default hooks */
      canvas.emscripten {
         border: 2px solid #333;
         border-radius: 0px;
         box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
         image-rendering: pixelated; 
         width: 480px; 
         height: 360px;
         max-width: 100%;  /* The Magic: Never grow wider than the phone screen */
         height: auto;     /* Keep the vertical proportions perfect so it doesn't stretch */
      }

      .instructions button {
         background-color: #444;
         color: #fff;
         border: 1px solid #666;
         border-radius: 4px;
         padding: 8px 12px;
         font-size: 1.2em;
         cursor: pointer;
         margin-right: 5px;
      }

      .instructions button:hover {
         background-color: #555;
      }

      .instructions button:active {
         background-color: #007acc; /* A nice highlight when clicked */
      }

      .keypad-container {
         display: grid;
         /* This creates exactly 5 columns, all sharing 1 fraction (1fr) of the space equally */
         grid-template-columns: repeat(5, 1fr); 

         /* This creates exactly 9 rows, all equal height */
         grid-template-rows: repeat(10, 1fr);    

         gap: 4px; /* The space between the buttons */

         width: 100%;
         max-width: 480px; /* Adjust this to make the keypad wider or narrower */ 
         min-width: 480px;
         max-height: 350px;
         margin-top: 0px;
      }

      /* Style the buttons inside the grid */
      .keypad-container button {
         background-color: #444;
         color: #fff;
         border: 1px solid #666;
         border-radius: 1px;
         padding: 10px 8px; /* Tweak padding to make buttons taller/shorter */
         font-size: 1.2em;

         line-height: 1;         /* <--- Right here! Kills invisible text padding */
         min-height: 0;          /* Kills browser safety minimums */
         min-width: 0;
         appearance: none;       /* Strips legacy OS button constraints */
         box-sizing: border-box; /* Forces padding to sit INSIDE the width */ 

         display: flex;
         justify-content: center; /* Centers the text horizontally */
         align-items: center;     /* Centers the text vertically */ 

         cursor: pointer;
         transition: background-color 0.1s; /* Smooth hover effect */ 
         position: relative;
      }

      .keypad-container button:hover {
         background-color: #555;
      }

      .keypad-container button:active {
         background-color: #007acc; /* Blue highlight on click */
      }

      /* Carve out a 2x2 block in the main grid and turn it into a 3x3 mini-grid */
      .dpad-wrapper {
         grid-column: span 2; /* Takes up 2 columns */
         grid-row: span 3;    /* Takes up 3 rows */
 
         display: grid;
         grid-template-columns: repeat(3, 1fr);
         grid-template-rows: repeat(3, 1fr);
         gap: 4px; /* Tighter gap so the arrows feel connected */
      }

      /* Force the arrow buttons to fit perfectly in their smaller grid slots */
      .dpad-wrapper button {
         padding: 0; /* Overrides the bulky padding from the main buttons */
         display: flex;
         justify-content: center;
         align-items: center;
         font-size: 1.2em; /* Makes the arrows easy to read */
      }

      /* Position the four arrows into the "plus" shape within the 3x3 mini-grid */
      .btn-up { grid-column: 2; grid-row: 1; }
      .btn-left { grid-column: 1; grid-row: 2; }
      .btn-right { grid-column: 3; grid-row: 2; }
      .btn-down { grid-column: 2; grid-row: 3; }

      .status-bar {
         grid-column: span 3;

         /* Center the text vertically inside the new grid slot */
         display: flex;
         align-items: center; 
         padding: 0 12px; /* Removes top/bottom padding, keeps side padding */

         box-sizing: border-box;
         transition: color 0.1s ease-in-out; 
      }

   </style>
</head>
<body>

   <script>
      function bindButtonTiming(btn) {
         let startTime = 0;
         let isPressed = false; // Prevents double-firing on mobile devices

         const handleDown = (e) => {
            e.preventDefault();
            if (isPressed) return;
            isPressed = true;

            // Record the exact start time
            startTime = performance.now(); 
         };

         const handleUp = (e) => {
            e.preventDefault();
            if (!isPressed) return;
            isPressed = false;

            // Calculate the total duration in milliseconds
            const durationMs = performance.now() - startTime;
         };

         // Attach listeners
         btn.addEventListener('mousedown', handleDown);
         btn.addEventListener('touchstart', handleDown);

         // Catch all release scenarios, including dragging the mouse away
         btn.addEventListener('mouseup', handleUp);
         btn.addEventListener('touchend', handleUp);
         btn.addEventListener('mouseleave', handleUp); 
      }
 
      function bindCalculatorButtons() {
         const buttons = document.querySelectorAll('.keypad-container button');
         const statusBar = document.getElementById('status-bar'); // Grab the display screen

         buttons.forEach(btn => {
            const btnId = parseInt(btn.getAttribute('data-id'));
            if (isNaN(btnId)) return;

            // --- NEW: Status Bar Hover Logic ---
            const tipText = btn.getAttribute('data-tooltip');
            if (tipText) {
               btn.addEventListener('mouseenter', () => {
                  statusBar.textContent = tipText;
               });
               btn.addEventListener('mouseleave', () => {
                  statusBar.textContent = ""; // Reverts when mouse leaves
               });
            }

            let holdTimer;
            let repeatInterval;

            // This function stops the repeating instantly
            const stopHold = (e) => {
                if (e) e.preventDefault();
                clearTimeout(holdTimer);
                clearInterval(repeatInterval);
            };

            // This function starts the hold logic
            const startHold = (e) => {
               e.preventDefault();

               // 1. Immediately fire the normal click once
               Module._html_button_pressed(btnId,0);

               // 2. Wait 500ms. If they haven't let go, start repeating
               holdTimer = setTimeout(() => {

                  Module._html_button_pressed(btnId,1);
                  // 3. Fire the click every 50ms until they let go
                  //repeatInterval = setInterval(() => {
                  //   Module._html_button_pressed(btnId);
                  //}, 50);
               }, 500); 
            };

            // Start the timers when pressed
            btn.addEventListener('mousedown', startHold);
            btn.addEventListener('touchstart', startHold);

            // Kill the timers when released or if the mouse drags away
            btn.addEventListener('mouseup', stopHold);
            btn.addEventListener('mouseleave', stopHold); 
            btn.addEventListener('touchend', stopHold);
         });
      }

      var Module = {
         print: (function() {
            return function(text) { console.log(text); };
         })(),
         printErr: function(text) {
            console.error(text);
         },
         canvas: (function() {
            var canvas = document.getElementById('canvas');
            canvas.addEventListener("webglcontextlost", function(e) { 
               alert('WebGL context lost. You will need to reload the page.'); 
               e.preventDefault(); 
            }, false);
            return canvas;
         })(),
         onRuntimeInitialized: function() {
            bindCalculatorButtons();
            console.log("Auto-repeating buttons bound and ready.");
         }
      };
</script>

<script async type="text/javascript" src="index.js"></script>

</html>
